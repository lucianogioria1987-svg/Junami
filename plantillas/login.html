<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Junami</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-screen w-full flex items-center justify-center font-sans text-slate-600 relative overflow-hidden bg-gray-900">

    <div class="absolute inset-0 z-0 w-full h-full">
        <img src="{{ url_for('static', filename='img/fondo.png') }}" 
             class="w-full h-full object-cover object-center" 
             alt="Fondo">
    </div>

    <div class="absolute inset-0 bg-black/50 z-10"></div>

    <div class="w-full max-w-md bg-white rounded-xl shadow-2xl overflow-hidden relative z-20 mx-4">
        
        <div class="bg-gradient-to-br from-blue-700 to-teal-500 p-8 text-center">
            <div class="w-16 h-16 bg-white bg-opacity-20 rounded-full flex items-center justify-center mx-auto mb-4 backdrop-blur-sm shadow-inner">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-widest uppercase">Junami</h1>
            <p class="text-blue-50 text-xs mt-1 uppercase tracking-wide opacity-90">Gestión Terapéutica</p>
        </div>

        <div class="p-8 pt-10">
            
            {% if error %}
            <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-3 mb-6 text-sm flex items-center rounded-r">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                {{ error }}
            </div>
            {% endif %}

            <form action="{{ url_for('dashboard_loguin_bp.login') }}" method="POST" class="space-y-6">
                
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Usuario</label>
                    <input type="text" name="usuario" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition bg-slate-50 focus:bg-white text-slate-700 placeholder-slate-400" placeholder="Ingrese su usuario">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Contraseña</label>
                    <input type="password" name="contrasena" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition bg-slate-50 focus:bg-white text-slate-700 placeholder-slate-400" placeholder="••••••••">
                </div>

                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg shadow-md hover:shadow-lg transition transform active:scale-[0.98]">
                    Ingresar
                </button>
            </form>

            <div class="mt-8 text-center">
                <p class="text-xs text-gray-400">© 2025 Junami Systems</p>
            </div>
        </div>
    </div>

</body>
</html>
